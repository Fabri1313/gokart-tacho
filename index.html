<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080b12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="mobile-web-app-capable" content="yes"><title>Go-Kart Tacho Querformat</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080b12;color:#fff;font-family:system-ui,Arial,sans-serif}main{height:100dvh;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(220px,1fr);gap:12px;padding:12px max(12px,env(safe-area-inset-right)) 12px max(12px,env(safe-area-inset-left));overflow:auto}.speedpanel{border:1px solid #253044;background:radial-gradient(ellipse at center,#1b2332,#0b101a 70%);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}.tag{color:#8d9aac;letter-spacing:.22em;font-size:clamp(10px,1.7vw,15px);font-weight:800}.speed{font-size:clamp(85px,23vw,260px);line-height:1;font-weight:900;letter-spacing:-.07em;padding-right:.07em;font-variant-numeric:tabular-nums}.unit{color:#ff7046;font-size:clamp(17px,2.8vw,28px);font-weight:900;letter-spacing:.2em}.side{min-height:0;display:flex;flex-direction:column;justify-content:center;gap:9px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.stat{min-width:0;border:1px solid #2a3445;border-radius:12px;background:#151c28;text-align:center;padding:12px 2px}.stat strong{display:block;font-size:clamp(19px,3vw,38px);font-variant-numeric:tabular-nums}.stat small{color:#aab5c5;font-size:clamp(8px,1vw,12px)}.accels{display:grid;grid-template-columns:1fr 1fr;gap:7px}.accel{background:#111b2b;border:1px solid #34445d;border-radius:12px;padding:7px;text-align:center}.accel strong{display:block;font-size:clamp(21px,3.4vw,40px);color:#ffb36a;font-variant-numeric:tabular-nums}.accel small{font-size:clamp(10px,1.2vw,13px);color:#cbd5e1}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{border:0;border-radius:12px;padding:12px 5px;background:#ff6238;color:#101018;font-size:clamp(13px,1.6vw,19px);font-weight:900;cursor:pointer;min-height:46px}button.secondary{background:#253044;color:#fff}#full{grid-column:span 2}#status,#accuracy{color:#aab5c5;text-align:center;font-size:clamp(10px,1.1vw,13px);margin:0}#accuracy{color:#8391a7}@media(orientation:portrait){main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;overflow:auto}.speed{font-size:clamp(100px,29vw,230px)}.side{padding-bottom:10px}.stat strong{font-size:clamp(22px,6vw,34px)}.stat small{font-size:10px}button{font-size:16px}}@media(orientation:landscape) and (max-height:370px){main{padding-top:5px;padding-bottom:5px;gap:7px}.side{gap:5px}.stat{padding:5px 2px}.accel{padding:3px}.accel strong{font-size:clamp(17px,3vw,25px)}button{padding:6px;min-height:35px}#status,#accuracy{font-size:10px}.speed{font-size:min(48vh,23vw)}}
body.immersive #accuracy{display:none}body.immersive main{height:100dvh}body.immersive #full{background:#354b61} </style></head><body><main><section class="speedpanel"><div class="tag">KART // GPS DASH</div><div id="speed" class="speed">0</div><div class="unit">KM/H</div></section><section class="side"><div class="stats"><div class="stat"><strong id="max">0</strong><small>MAX KM/H</small></div><div class="stat"><strong id="distance">0.00</strong><small>STRECKE KM</small></div><div class="stat"><strong id="time">00:00</strong><small>FAHRZEIT</small></div></div><div class="accels"><div class="accel"><strong id="a50">—</strong><small>0–50 km/h · s</small></div><div class="accel"><strong id="a100">—</strong><small>0–100 km/h · s</small></div></div><div class="controls"><button id="toggle">START</button><button class="secondary" id="reset">RESET</button><button class="secondary" id="full">⛶ VOLLBILD</button></div><p id="status" role="status">GPS benötigt HTTPS und Standortfreigabe.</p><p id="accuracy"></p></section></main><script>
let watch=null,started=0,elapsed=0,ticker=null,max=0,km=0,prev=null,lastSpeed=0,launch=null,priorSample=null,hit50=false,hit100=false,armed=true;const $=id=>document.getElementById(id);function renderTime(){let s=Math.floor((elapsed+(started?Date.now()-started:0))/1000);$('time').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function stop(){if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;if(started){elapsed+=Date.now()-started;started=0}clearInterval(ticker);$('toggle').textContent='START';document.body.classList.remove('running');$('status').textContent='Gestoppt';$('speed').textContent='0';prev=null;launch=null;priorSample=null;armed=true;renderTime()}function dist(a,b){const R=6371,rad=Math.PI/180,dlat=(b.latitude-a.latitude)*rad,dlon=(b.longitude-a.longitude)*rad,x=Math.sin(dlat/2)**2+Math.cos(a.latitude*rad)*Math.cos(b.latitude*rad)*Math.sin(dlon/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}function onPos(p){const c=p.coords,accuracy=c.accuracy??999;let v=typeof c.speed==='number'&&c.speed>=0?c.speed*3.6:null;if(prev&&p.timestamp>prev.t){const dt=(p.timestamp-prev.t)/1000,d=dist(prev.c,c);if(v===null&&dt>0)v=d/dt*3600;if(accuracy<=35&&prev.accuracy<=35&&dt>0&&d<dt*.07&&d>Math.max(.004,(accuracy+prev.accuracy)/2000*.3))km+=d}if(accuracy<=50){v=Math.max(0,Math.min(250,v??0));lastSpeed=v;
// Approximate GPS acceleration times; crossing timestamps are linearly interpolated.
const t=p.timestamp;
if(v<2){if(priorSample&&priorSample.v<2){armed=true;launch=null;hit50=false;hit100=false} }
if(armed&&priorSample&&priorSample.v<2&&v>=2){launch=priorSample.t+(2-priorSample.v)/(v-priorSample.v)*(t-priorSample.t);armed=false;hit50=false;hit100=false;}
if(launch!==null&&priorSample&&t>priorSample.t){for(const [target,key,flag] of [[50,'a50','hit50'],[100,'a100','hit100']]){if(!((target===50&&hit50)||(target===100&&hit100))&&priorSample.v<target&&v>=target){const crossing=priorSample.t+(target-priorSample.v)/(v-priorSample.v)*(t-priorSample.t);$(key).textContent=((crossing-launch)/1000).toFixed(2);if(target===50)hit50=true;else hit100=true;}}}
priorSample={v,t};
$('speed').textContent=String(Math.round(v));max=Math.max(max,v);$('max').textContent=String(Math.round(max));$('distance').textContent=km.toFixed(2);$('status').textContent='GPS aktiv · Beschleunigungsmessung automatisch';}else{$('status').textContent='Warte auf genaueres GPS-Signal …'}$('accuracy').textContent='GPS-Genauigkeit: ±'+Math.round(accuracy)+' m';prev={c,t:p.timestamp,accuracy}}
$('toggle').onclick=()=>{if(watch!==null){stop();return}if(!navigator.geolocation){$('status').textContent='GPS wird von diesem Browser nicht unterstützt.';return}started=Date.now();ticker=setInterval(renderTime,500);$('toggle').textContent='STOP';document.body.classList.add('running');$('status').textContent='Suche GPS-Signal …';watch=navigator.geolocation.watchPosition(onPos,e=>{$('status').textContent='GPS-Fehler: '+e.message+' — Standortberechtigung und HTTPS prüfen.';stop();$('status').textContent='GPS-Fehler: '+e.message},{enableHighAccuracy:true,maximumAge:0,timeout:15000})};$('reset').onclick=()=>{max=0;km=0;elapsed=0;if(started)started=Date.now();prev=null;launch=null;priorSample=null;armed=true;hit50=false;hit100=false;$('a50').textContent='—';$('a100').textContent='—';$('max').textContent='0';$('distance').textContent='0.00';renderTime()};$('full').onclick=async()=>{const btn=$('full');if(document.fullscreenElement){try{await document.exitFullscreen()}catch(e){}document.body.classList.remove('immersive');btn.textContent='⛶ VOLLBILD';return}if(document.documentElement.requestFullscreen){try{await document.documentElement.requestFullscreen();document.body.classList.add('immersive');btn.textContent='VOLLBILD BEENDEN';return}catch(e){}}document.body.classList.toggle('immersive');btn.textContent=document.body.classList.contains('immersive')?'ANSICHT ZURÜCK':'⛶ VOLLBILD';$('status').textContent='Browser-Vollbild nicht verfügbar. iPhone: HTTPS-Seite in Safari öffnen → Teilen → Zum Home-Bildschirm; danach von dort starten. Android: Seite zum Startbildschirm hinzufügen.';};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){document.body.classList.remove('immersive');$('full').textContent='⛶ VOLLBILD'}});renderTime();
</script></body></html>
